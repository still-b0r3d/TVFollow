name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# read-only unless a job says otherwise; only the release job below can write
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the exe says which commit it was built from, "1.2+abc1234"; the repo's copy says "dev"
      - name: Stamp the commit
        shell: pwsh
        run: |
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          function Stamp($file, $placeholder) {
            $path = Join-Path $PWD $file
            $text = [IO.File]::ReadAllText($path)
            $count = [regex]::Matches($text, [regex]::Escape($placeholder)).Count
            if ($count -ne 1) { throw "$file should have $placeholder once, not $count times" }
            [IO.File]::WriteAllText($path, $text.Replace($placeholder, $placeholder.Replace('dev', $commit)))
          }
          Stamp src\Program.cs 'Build = "dev"'
          Stamp src\AssemblyInfo.cs '+dev"'
          "stamped $commit"

      - name: Build and test
        shell: cmd
        run: build.cmd test

      # one line ending in \n, so sha256sum -c can check a download too
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash bin\TVFollow.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content bin\TVFollow.exe.sha256 "$hash  TVFollow.exe`n" -NoNewline -Encoding ascii
          Get-Content bin\TVFollow.exe.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TVFollow
          path: |
            bin/TVFollow.exe
            bin/TVFollow.exe.sha256

  # a version tag (v1.0, v1.1, ...) drafts a release from the build above
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TVFollow
          path: bin

      # the exe's "1.2+abc1234": 1.2 must be the tag, abc1234 this commit
      - name: The tag must match the exe's version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = (Get-Item bin\TVFollow.exe).VersionInfo.ProductVersion
          $version, $build = $exe.Split('+')
          if ($tag -ne $version) { Write-Error "Tag $env:GITHUB_REF_NAME doesn't match TVFollow.exe's version $exe"; exit 1 }
          if ($build -ne $env:GITHUB_SHA.Substring(0, 7)) { Write-Error "TVFollow.exe ($exe) isn't stamped with this commit, $env:GITHUB_SHA"; exit 1 }
          "tag and exe agree: $exe"

      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME bin/TVFollow.exe bin/TVFollow.exe.sha256 --repo $env:GITHUB_REPOSITORY --draft --title "TVFollow $env:GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed."
