name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# read-only unless a job says otherwise; only the release job below can write
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        shell: cmd
        run: build.cmd test

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash bin\TVFollow.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TVFollow.exe" | Out-File bin\TVFollow.exe.sha256 -Encoding ascii
          Get-Content bin\TVFollow.exe.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TVFollow
          path: |
            bin/TVFollow.exe
            bin/TVFollow.exe.sha256

  # a version tag (v1.0, v1.1, ...) drafts a release from the build above
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TVFollow
          path: bin

      - name: The tag must match the exe's version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = (Get-Item bin\TVFollow.exe).VersionInfo.ProductVersion
          if ($tag -ne $exe) { Write-Error "Tag $env:GITHUB_REF_NAME doesn't match TVFollow.exe's version $exe"; exit 1 }
          "tag and exe agree: $exe"

      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME bin/TVFollow.exe bin/TVFollow.exe.sha256 --repo $env:GITHUB_REPOSITORY --draft --title "TVFollow $env:GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed."
